<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>图片审计</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <h3>📷 图片审计</h3>
      </div>
      <div class="stats" id="stats">加载中...</div>
    </header>
    
    <main>
      <div class="section">
        <div class="section-header">
          <h4>标准图片</h4>
          <span class="count" id="normalCount">0</span>
        </div>
        <div class="image-grid" id="normalList"></div>
      </div>
      
      <div class="divider">
        <span>矢量图与BASE64</span>
      </div>
      
      <div class="section">
        <div class="section-header">
          <h4>特殊格式</h4>
          <span class="count" id="specialCount">0</span>
        </div>
        <div class="image-grid small" id="specialList"></div>
      </div>
    </main>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
